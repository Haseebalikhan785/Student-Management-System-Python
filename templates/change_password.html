{% extends 'base.html' %}
{% block title %}Change password · Student Management{% endblock %}
{% block content %}<p class="eyebrow">ACCOUNT SETTINGS</p><h1>Change password</h1>
<section class="panel password-panel"><p class="muted">Choose a new password with at least 8 characters.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label><button class="primary" type="submit">Update password</button></form></section>{% endblock %}
